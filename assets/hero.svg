<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Kcoof Toolkit — Recon to report, one pipeline">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#475569" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="880" height="440" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="880" height="440" fill="#0F172A"/>
  <rect width="880" height="440" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- brand -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace">
    <text x="48" y="58" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="1">
      <tspan fill="#22C55E">&gt;_</tspan> KCOOF<tspan fill="#94A3B8">//</tspan>TOOLKIT
    </text>

    <!-- headline -->
    <text x="48" y="130" font-size="44" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Recon to report.</text>
    <text x="48" y="182" font-size="44" font-weight="700" fill="#22C55E" letter-spacing="-1" filter="url(#glow)">One pipeline.</text>

    <!-- sub -->
    <text x="48" y="222" font-size="15" fill="#94A3B8">Four open-source tools that chain end to end — enumerate, filter, scan, report.</text>

    <!-- terminal window -->
    <rect x="48" y="252" width="784" height="148" rx="12" fill="#0B1120" stroke="#272F42" stroke-width="1"/>
    <rect x="48" y="252" width="784" height="34" rx="12" fill="#1B2336"/>
    <line x1="48" y1="286" x2="832" y2="286" stroke="#272F42" stroke-width="1"/>
    <circle cx="70" cy="269" r="5.5" fill="#EF4444"/>
    <circle cx="90" cy="269" r="5.5" fill="#F9AB00"/>
    <circle cx="110" cy="269" r="5.5" fill="#22C55E"/>
    <text x="812" y="274" font-size="11" fill="#94A3B8" text-anchor="end">secscan — demo</text>

    <text x="66" y="314" font-size="12.5" fill="#F8FAFC"><tspan fill="#22C55E">$ </tspan>python -m secscan subdomains.txt --oob -o reports</text>
    <text x="66" y="336" font-size="12.5" fill="#94A3B8">[*] Scope: target.com · 34 hosts · hidden params: adminmode, debug</text>
    <text x="66" y="358" font-size="12.5" font-weight="700" fill="#EF4444">[CRITICAL] Time-based blind SQLi in 'id' (MySQL)</text>
    <text x="66" y="380" font-size="12.5" fill="#22C55E">[+] OOB armed: oast.fun · dashboard.html + findings.md ready</text>

    <!-- footer badge -->
    <g transform="translate(48, 416)">
      <rect width="196" height="18" rx="9" fill="#1B2336" stroke="#475569" stroke-width="1"/>
      <circle cx="12" cy="9" r="3.5" fill="#22C55E"/>
      <text x="24" y="13" font-size="10.5" fill="#94A3B8">v2.0 · authorized targets only</text>
    </g>
  </g>
</svg>
